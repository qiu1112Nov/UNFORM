name: Build UNFORM Preview Artifact

on:
  push:
    branches: [feat/unform-4-sculpt-view]

permissions:
  contents: read

concurrency:
  group: preview-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare site with /UNFORM/ directory
        run: |
          mkdir -p "$RUNNER_TEMP/unform-preview/UNFORM"
          cp -a dist/. "$RUNNER_TEMP/unform-preview/UNFORM/"
          test -f "$RUNNER_TEMP/unform-preview/UNFORM/index.html"
      - name: Upload static preview (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: UNFORM-4-sculpt-view-static-preview
          path: ${{ runner.temp }}/unform-preview/
          if-no-files-found: error
          retention-days: 14
